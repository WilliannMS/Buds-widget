name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: unzip -q BudsWidget.zip -d _src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Compilar o APK
        working-directory: _src/BudsWidget
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear o APK
        run: cp _src/BudsWidget/app/build/outputs/apk/debug/app-debug.apk BudsWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BudsWidget-apk
          path: BudsWidget.apk

      - name: Publicar em Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BudsWidget.apk \
            --title "Buds Widget (APK mais recente)" \
            --notes "APK gerado automaticamente a partir do commit ${GITHUB_SHA::7}." \
            --target "$GITHUB_SHA"
            
