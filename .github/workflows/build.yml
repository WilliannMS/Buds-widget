name: Build Bluetooth Widget

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descompactar o projeto
        run: |
          mkdir -p _src
          unzip -q BluetoothWidget.zip -d _src
          PROJ=$(dirname "$(find _src -name settings.gradle.kts | head -n 1)")
          echo "PROJ=$PROJ" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        working-directory: ${{ env.PROJ }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Copiar APK
        run: cp "$PROJ/app/build/outputs/apk/debug/app-debug.apk" BluetoothWidget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BluetoothWidget
          path: BluetoothWidget.apk

      - name: Publicar na aba Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest BluetoothWidget.apk --title "Bluetooth Widget" --notes "APK mais recente" --target "$GITHUB_SHA"
          
